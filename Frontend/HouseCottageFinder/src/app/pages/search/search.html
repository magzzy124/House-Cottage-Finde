<div class="filters flex">
<div class="input bg-[#f3f3f3] rounded-[15px] p-2 h-13 w-150 flex items-center">
  <svg class="h-[90%] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <g
      stroke-linejoin="round"
      stroke-linecap="round"
      stroke-width="2.5"
      fill="none"
      stroke="currentColor"
    >
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </g>
  </svg>
<geoapify-geocoder-autocomplete
  class="flex-1"
  placeholder="Search for an address"
  [lang]="'en'"
  [limit]="8"
  [addDetails]="true"
  (placeSelect)="onPlaceSelected($event)"
  (suggestionsChange)="onSuggestionsChange($event)">
>
</geoapify-geocoder-autocomplete>
</div>
<!-- change popover-1 and --anchor-1 names. Use unique names for each dropdown -->
<button class="btn bg-[#f3f3f3] border-0 h-13 rounded-[15px]" popovertarget="popover-1" style="anchor-name:button1">
  Button
</button>
<ul class="dropdown menu w-52 rounded-box bg-base-100 shadow-sm"
  popover id="popover-1" style="position-anchor:button1">
  <li><a>Item 1</a></li>
  <li><a>Item 2</a></li>
</ul>
</div>

<div class="results flex justify-around h-[calc(100vh-52px-80px)]" (click)="fetchAllCards()">
<div class="left flex-1 h-full grid grid-cols-[repeat(auto-fit,minmax(280px,1fr))] gap-3 p-5 overflow-y-auto">
  @for(card of houseService.cards();track card.id){
    <app-card [cardDetails]="card"/>
  }
</div>
<div class="right flex-1 h-full">
<app-map/>

</div>
</div>
