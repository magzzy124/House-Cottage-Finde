<div class="min-h-[calc(100vh-72px)] flex items-center justify-center bg-gradient-to-br from-slate-50 via-white to-blue-50/30 p-5">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#4a8dd0] to-[#3568a0] flex items-center justify-center shadow-lg shadow-[#4a8dd0]/20 mx-auto mb-4">
        <img src="house.svg" alt="HouseFinder" class="w-8 h-8 brightness-0 invert" />
      </div>
      <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Welcome back</h1>
      <p class="text-sm text-slate-400 mt-2">Sign in to your HouseFinder account</p>
    </div>

    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8">
      <div class="flex flex-col gap-5">
        <div class="flex flex-col gap-2">
          <label class="text-sm font-semibold text-slate-700" for="email">Email</label>
          <input
            [(ngModel)]="email"
            id="email"
            type="email"
            placeholder="you@example.com"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium placeholder-slate-400 outline-none transition-all duration-200 focus:border-[#4a8dd0] focus:ring-2 focus:ring-[#4a8dd0]/10"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-sm font-semibold text-slate-700" for="password">Password</label>
          <div class="relative w-full">
            <input
              [(ngModel)]="password"
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password"
              class="w-full rounded-xl border border-slate-200 px-4 py-3 pr-12 text-sm font-medium placeholder-slate-400 outline-none transition-all duration-200 focus:border-[#4a8dd0] focus:ring-2 focus:ring-[#4a8dd0]/10"
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 flex items-center px-4 cursor-pointer text-slate-400 hover:text-slate-600 transition-colors"
            >
              <svg
                class="h-5 w-5"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                @if (showPassword) {
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  ></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                } @else {
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                }
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="checkbox checkbox-sm checked:bg-[#4a8dd0]" checked />
            <span class="font-medium text-slate-600">Remember me</span>
          </label>
          <a class="font-semibold text-[#4a8dd0] hover:underline cursor-pointer">Forgot password?</a>
        </div>

        <button
          type="button"
          (click)="onLogin()"
          [disabled]="loading"
          class="w-full rounded-xl py-3 text-sm font-bold text-white bg-gradient-to-r from-[#4a8dd0] to-[#3568a0] hover:from-[#3d7ab8] hover:to-[#2d5a8c] shadow-lg shadow-[#4a8dd0]/25 hover:shadow-xl hover:shadow-[#4a8dd0]/30 disabled:opacity-60 transition-all duration-200 cursor-pointer"
        >
          @if (loading) {
            <span class="loading loading-spinner loading-sm"></span>
            Signing in...
          } @else {
            Sign in
          }
        </button>

        @if (success) {
          <div class="bg-emerald-50 text-emerald-700 text-sm font-medium px-4 py-3 rounded-xl border border-emerald-200">
            {{ success }}
          </div>
        }

        @if (error) {
          <div class="bg-red-50 text-red-600 text-sm font-medium px-4 py-3 rounded-xl border border-red-200">
            {{ error }}
          </div>
        }

        <div class="relative my-2">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-100"></div>
          </div>
          <div class="relative flex justify-center text-xs">
            <span class="px-3 bg-white text-slate-400 font-medium">or continue with</span>
          </div>
        </div>

        <button
          type="button"
          class="w-full flex items-center justify-center gap-3 rounded-xl py-3 border border-slate-200 bg-white hover:bg-slate-50 text-sm font-semibold text-slate-700 transition-all duration-200 cursor-pointer"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>

        <p class="text-center text-sm text-slate-500 mt-2">
          Don't have an account?
          <a routerLink="/register" class="font-semibold text-[#4a8dd0] hover:underline cursor-pointer">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>
