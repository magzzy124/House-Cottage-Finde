<div class="h-[calc(100vh-72px)] overflow-y-auto">
  <div class="max-w-2xl mx-auto px-8 py-10">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">Create a listing</h1>
    <p class="text-sm text-slate-400 mb-8">Fill in the details below to publish your property</p>

    @if (success()) {
      <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 text-center">
        <svg class="w-12 h-12 text-emerald-500 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <p class="text-lg font-bold text-emerald-700">Listing created!</p>
        <p class="text-sm text-emerald-600 mt-1">Redirecting to your listing...</p>
      </div>
    } @else {
      <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-8">
        <div class="flex flex-col gap-5">
          <div class="flex flex-col gap-2">
            <label class="text-sm font-semibold text-slate-700">Title *</label>
            <input
              [(ngModel)]="title"
              type="text"
              placeholder="e.g. Modern apartment in city center"
              class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium placeholder-slate-400 outline-none transition-all duration-200 focus:border-[#4a8dd0] focus:ring-2 focus:ring-[#4a8dd0]/10"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-semibold text-slate-700">Address *</label>
            <input
              [(ngModel)]="address"
              type="text"
              placeholder="Street and number"
              class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium placeholder-slate-400 outline-none transition-all duration-200 focus:border-[#4a8dd0] focus:ring-2 focus:ring-[#4a8dd0]/10"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-semibold text-slate-700">City *</label>
            <input
              [(ngModel)]="city"
              type="text"
              placeholder="e.g. Belgrade"
              class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium placeholder-slate-400 outline-none transition-all duration-200 focus:border-[#4a8dd0] focus:ring-2 focus:ring-[#4a8dd0]/10"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-semibold text-slate-700">Deal type *</label>
            <div class="inline-flex h-11 w-full items-center rounded-xl bg-slate-100 p-1">
              @for (type of dealTypes; track type) {
                <button
                  type="button"
                  (click)="dealType = type"
                  class="flex-1 h-9 text-sm font-semibold rounded-lg transition-all duration-200 cursor-pointer"
                  [class.bg-white]="dealType === type"
                  [class.shadow-sm]="dealType === type"
                  [class.text-slate-900]="dealType === type"
                  [class.text-slate-500]="dealType !== type"
                >{{ type }}</button>
              }
            </div>
          </div>

          <div class="grid grid-cols-3 gap-4">
            <div class="flex flex-col gap-2">
              <label class="text-sm font-semibold text-slate-700">Price ($) *</label>
              <input
                [(ngModel)]="price"
                type="number"
                placeholder="0"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium placeholder-slate-400 outline-none transition-all duration-200 focus:border-[#4a8dd0] focus:ring-2 focus:ring-[#4a8dd0]/10"
              />
            </div>
            <div class="flex flex-col gap-2">
              <label class="text-sm font-semibold text-slate-700">Bedrooms *</label>
              <input
                [(ngModel)]="bedrooms"
                type="number"
                placeholder="0"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium placeholder-slate-400 outline-none transition-all duration-200 focus:border-[#4a8dd0] focus:ring-2 focus:ring-[#4a8dd0]/10"
              />
            </div>
            <div class="flex flex-col gap-2">
              <label class="text-sm font-semibold text-slate-700">Bathrooms *</label>
              <input
                [(ngModel)]="bathrooms"
                type="number"
                placeholder="0"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium placeholder-slate-400 outline-none transition-all duration-200 focus:border-[#4a8dd0] focus:ring-2 focus:ring-[#4a8dd0]/10"
              />
            </div>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-semibold text-slate-700">Area (m²) *</label>
            <input
              [(ngModel)]="area"
              type="number"
              placeholder="0"
              class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium placeholder-slate-400 outline-none transition-all duration-200 focus:border-[#4a8dd0] focus:ring-2 focus:ring-[#4a8dd0]/10"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-semibold text-slate-700">Image URL</label>
            <input
              [(ngModel)]="imageUrl"
              type="text"
              placeholder="https://... (leave empty for default)"
              class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium placeholder-slate-400 outline-none transition-all duration-200 focus:border-[#4a8dd0] focus:ring-2 focus:ring-[#4a8dd0]/10"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-semibold text-slate-700">Description</label>
            <textarea
              [(ngModel)]="description"
              rows="4"
              placeholder="Describe your property..."
              class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium placeholder-slate-400 outline-none transition-all duration-200 focus:border-[#4a8dd0] focus:ring-2 focus:ring-[#4a8dd0]/10 resize-none"
            ></textarea>
          </div>

          @if (error()) {
            <div class="bg-red-50 text-red-600 text-sm font-medium px-4 py-3 rounded-xl border border-red-200">
              {{ error() }}
            </div>
          }

          <button
            (click)="onSubmit()"
            [disabled]="loading()"
            class="w-full rounded-xl py-3 text-sm font-bold text-white bg-gradient-to-r from-[#4a8dd0] to-[#3568a0] hover:from-[#3d7ab8] hover:to-[#2d5a8c] shadow-lg shadow-[#4a8dd0]/25 hover:shadow-xl hover:shadow-[#4a8dd0]/30 disabled:opacity-60 transition-all duration-200 cursor-pointer"
          >
            @if (loading()) {
              <span class="loading loading-spinner loading-sm"></span>
              Publishing...
            } @else {
              Publish listing
            }
          </button>
        </div>
      </div>
    }
  </div>
</div>
