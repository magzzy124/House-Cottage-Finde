<div class="navbar border-2 h-20 flex justify-between items-center px-20">
  <div class="logo border-2 flex items-center gap-2.5 cursor-pointer">
    <img src="house.svg" alt="HouseSvg" class="w-10" />
    <h1 class="font-[1000] text-3xl">HouseFinder</h1>
  </div>
  <ul class="flex gap-10 text-[1.2rem]">
    @for (link of links; track link) {
      <li class="font-semibold hover:text-[#5393d3] transition-all cursor-pointer">
        <a [routerLink]="link">{{ link | titlecase }}</a>
      </li>
    }
  </ul>
<div class="profile border-2 flex gap-4.5 items-center">
    <img class="w-8 cursor-pointer" src="heart.svg" alt="heart" />
    @if (auth.currentUser(); as user) {
      <div class="flex items-center gap-2.5">
        <div class="profilePicture w-13 h-13 border rounded-full p-1.5 relative">
          <img src="user.svg" alt="User" />
          <span
            class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-green-500 rounded-full border-2 border-white"
            title="Online"
          ></span>
        </div>
        <div class="flex flex-col leading-tight">
          <span class="font-semibold text-sm">Hi, {{ user.firstName }}</span>
          <button
            (click)="logout()"
            class="text-xs text-left text-slate-500 hover:text-red-500 transition-colors cursor-pointer"
          >
            Log out
          </button>
        </div>
      </div>
    } @else {
      <a routerLink="/login" class="profilePicture w-13 h-13 border rounded-full p-1.5 cursor-pointer">
        <img src="user.svg" alt="User" />
      </a>
    }
  </div>
</div>

<router-outlet></router-outlet>
